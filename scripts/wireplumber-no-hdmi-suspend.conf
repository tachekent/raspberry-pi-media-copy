# Disable idle-suspend for the HDMI audio output.
#
# PipeWire/WirePlumber suspends an ALSA sink after 5s idle by default
# (scripts/node/suspend-node.lua, session.suspend-timeout-seconds). Waking
# it back up cold — which happens every time Kodi/mpv (re)starts after any
# idle gap — produces an audible pop/glitch on this HDMI output (confirmed
# 2026-09-07, described as "an HDMI glitch" right after a Kodi restart).
# Setting the timeout to 0 keeps the sink open continuously so it never has
# to cold-start again.
#
# Deploy to /etc/wireplumber/wireplumber.conf.d/51-no-hdmi-suspend.conf and
# restart wireplumber (or reboot) to apply.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
